# Central visual style configuration.
# Keep biological/statistical transformations in scripts, not here.

schema_version: 1
active_profile: publication

profiles:
  publication:
    typography:
      family: sans
      base_size_pt: 10
      title_size_pt: 13
      subtitle_size_pt: 10.5
      axis_title_size_pt: 10
      axis_text_size_pt: 8.5
      legend_title_size_pt: 9
      legend_text_size_pt: 8
      strip_text_size_pt: 8.5
      caption_size_pt: 7.5
      title_face: bold
      strip_face: bold
  presentation:
    typography:
      family: sans
      base_size_pt: 14
      title_size_pt: 20
      subtitle_size_pt: 15
      axis_title_size_pt: 14
      axis_text_size_pt: 12
      legend_title_size_pt: 12
      legend_text_size_pt: 11
      strip_text_size_pt: 12
      caption_size_pt: 10
      title_face: bold
      strip_face: bold

output:
  directory: results/plots
  formats: [png, pdf]
  units: in
  background: white
  raster:
    dpi: 300
    device: ragg
  vector:
    pdf_device: cairo_pdf
    svg_device: svglite

palettes:
  continuous:
    heatmap:
      provider: viridis
      option: C
      begin: 0.12
      end: 0.88
      na_colour: "#D9D9D9"
    diverging:
      low: "#2166AC"
      mid: "#F7F7F7"
      high: "#B2182B"
      midpoint: 0
      na_colour: "#D9D9D9"
  qualitative:
    binary:
      absent: "#6B6B6B"
      present: "#0072B2"
    okabe_ito_8:
      - "#E69F00"
      - "#56B4E9"
      - "#009E73"
      - "#F0E442"
      - "#0072B2"
      - "#D55E00"
      - "#CC79A7"
      - "#000000"

category_labels:
  lcr_present: "LCR"
  pfam_present: "PFAM domains"
  tm_present: "Transmembrane region"
  signal_peptide_present: "Signal peptide"
  algal_parasite: "Algal parasite"
  animal_endosymbiont: "Animal endosymbiont"
  animal_parasite: "Animal parasite"
  plant_pathogen: "Plant pathogen"
  soil_saprotroph: "Soil saprotroph"
  unspecified_saprotroph: "Unspecified saprotroph"
