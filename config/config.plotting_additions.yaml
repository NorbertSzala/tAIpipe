# Merge this file into config/config.yaml or load it as an additional configfile.
# It contains only plotting/statistics additions and does not replace paths/tool settings.

plots:
  enabled: true
  groups:
    tai_extremes: true
    gene_features: true
    genome_metrics: true
    codon_profiles: true
    go_enrichment: false
    correlations: true
    qc: true
  output_formats: [png, pdf]
  max_categories_without_faceting: 8
  default_top_n_terms: 20
  default_top_n_categories: 12

plot_style:
  config_file: "config/plotting.yaml"
  heatmap_palette:
    provider: "viridis"
    option: "C"
    begin: 0.12
    end: 0.88
    na_colour: "#D9D9D9"

script_suggestion_plots:
  enabled: true
  feature_metric: "tAI"
  top_fraction: 0.10
  chosen_go_terms: "XXXXX"
  correlation_method: "spearman"
  max_violin_rows_per_group: 50000
  max_scatter_rows: 100000
  gene_correlation_variables:
    - tAI
    - CAI
    - ENC
    - GC
    - GC3s
    - protein_length_aa
    - lcr_total_length
    - tm_total_length
  genome_correlation_variables:
    - mean_tAI
    - mean_CAI
    - mean_ENC
    - genome_gc
    - mean_GC3s
    - fraction_lcr
    - fraction_tm
    - fraction_signal_peptide
    - fraction_pfam

go_plots:
  enabled: false
  q_threshold: 0.05
  min_abs_log2_or: 0.25
  min_informative_genomes: 5
  min_total_genes_with_term: 30
  max_terms_per_tail_namespace: 8
  max_plot_terms: 24
  namespaces:
    - biological_process
    - molecular_function
    - cellular_component

pfam_lcr_plots:
  enabled: true
  top_n_pfam: 25
  pfam_description_table: "resources/annotations/pfam_descriptions_manual.tsv"

statistics:
  per_genome_feature_effects:
    enabled: true
    min_genes: 100
    min_class_genes: 10
    min_genomes: 5
  lifestyle_within_phylum_permutations:
    enabled: true
    n_perm: 9999
    seed: 1
  tai_extremes:
    enabled: true
    group_column: sample
    id_column: gene_id
    value_column: tAI
    tail_fractions: [0.10, 0.01]
    min_genes_per_sample: 100
    min_tail_size: 20
    binary_features:
      PFAM domains: pfam_present
      Transmembrane region: tm_present
      Signal peptide: signal_peptide_present
      LCR: lcr_present
    continuous_features:
      Protein length: protein_length_aa
      GC3s: GC3s
      Total transmembrane length: tm_total_length
      Total LCR length: lcr_total_length

# Codon-profile plotting. Keeping this block separate prevents confusion with
# plots.groups.codon_profiles, which is only a boolean on/off switch.
codon_profile_plots:
  usage_value: "genome_RSCU"
  heatmap_value: "auto"
  top_n_variable_codons: 30
  heatmap_large_width: 16.5
  heatmap_large_height: 23.4
  heatmap_min_group_n: 5
