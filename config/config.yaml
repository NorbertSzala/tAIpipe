# ==============================================================================
# tAIpipe main configuration
# ==============================================================================
# This file defines the biological, analytical and output-level behaviour of the
# pipeline. It should be the main user-facing configuration file.
#
# Keep execution settings such as cores, conda, latency-wait and rerun-incomplete
# in workflow/profiles/<profile>/config.yaml.
#
# Keep purely visual plot styling such as figure sizes, themes, fonts and colour
# palettes in config/plotting.yaml.
# ==============================================================================


# ==============================================================================
# 1. Project paths
# ==============================================================================
# These paths define the input datasets, manually provided resources and canonical
# output locations. Paths are resolved relative to the project root unless absolute.
# ==============================================================================

paths:
  # Main sample metadata table. Must contain sample, species, accession, domain,
  # kingdom, phylum, lifestyle, genetic_code, cds and include columns.
  metadata_dataset: config/samples.tsv

  # Raw/provided biological input directories.
  data_cds: ../FungaltAI/data/CDS
  data_genome: ../FungaltAI/data/genome
  data_gff: ../FungaltAI/data/gff
  data_proteome: ../FungaltAI/data/proteome

  # Genetic-code resources used by tRNAscan-SE and codon-level calculations.
  genetic_codes_trnascanse: resources/genetic_codes/trnascanse
  genetic_codes_tables: resources/genetic_codes/tables

  # Optional annotation table. It may contain GO, UniProt, PFAM, signal peptide,
  # transmembrane and low-complexity annotations.
  external_annotations: resources/annotations/main_dataset_annotations.tsv

  # Root output directories.
  results: results
  logs: logs
  benchmarks: benchmarks

  # Output subdirectories.
  qc: results/qc
  per_genome: results/per_genome
  tables: results/tables
  statistics: results/statistics
  plots: results/plots
  reports: results/reports

  # Canonical output tables.
  gene_features: results/tables/gene_features.tsv
  genome_summary: results/tables/genome_summary.tsv
  codon_profiles: results/tables/codon_profiles.tsv
  gene_go: results/tables/gene_go.tsv
  gene_pfam: results/tables/gene_pfam.tsv

  # Canonical statistical outputs.
  gene_feature_tests: results/statistics/gene_feature_tests.tsv
  genome_group_tests: results/statistics/genome_group_tests.tsv
  go_enrichment: results/statistics/go_enrichment.tsv


# ==============================================================================
# 2. GO dictionary
# ==============================================================================
# The GO dictionary is used to translate GO identifiers into names and namespaces.
# If the local TSV is missing, the pipeline may use the local OBO or download it.
# ==============================================================================

go_dictionary:
  enabled: true
  path: resources/go/go_terms.tsv
  obo_path: resources/go/go-basic.obo
  obo_url: http://current.geneontology.org/ontology/go-basic.obo


# ==============================================================================
# 3. Ribosomal reference for CAI
# ==============================================================================
# CAI requires a reference gene set. For fungi, using KOfamScan-selected cytosolic
# eukaryotic ribosomal proteins is more defensible than regex-based FASTA header
# matching.
#
# Recommended main-analysis setting:
#   selection_strategy: best_per_ko
#   top_n_per_ko: 1
#
# top_n_per_ko > 1 can be useful as a sensitivity analysis, but should not be the
# default unless you explicitly want broader reference sets.
# ==============================================================================

ribosomal_reference:
  enabled: true
  method: kofamscan_cytosolic_eukaryotic_ribosome

  # Minimum/maximum accepted number of reference CDS per genome.
  min_reference_genes: 50
  max_reference_genes: 180

  # Selection strategy for ribosomal genes.
  # Allowed conceptual values:
  #   best_per_ko  - one best hit per KO; recommended default
  #   top_n_per_ko - top N hits per KO; sensitivity/broader-reference mode
  selection_strategy: best_per_ko
  top_n_per_ko: 1

  # Fraction of expected cytosolic ribosomal KOs that should be represented.
  min_ko_coverage: 0.7


# ==============================================================================
# 4. KOfamScan settings
# ==============================================================================
# KOfamScan is used here to identify cytosolic eukaryotic ribosomal proteins.
# The restricted HAL/profile set should represent only the intended ribosomal KOs.
# ==============================================================================

kofamscan:
  enabled: true

  database:
    ko_list: resources/kofamscan/ko_list
    profiles_dir: resources/kofamscan/profiles

  ribosome_reference:
    brite_json: resources/kofamscan/ribosome_reference/ko03011.json
    ko_table: resources/kofamscan/ribosome_reference/cytosolic_eukaryotic_ribosome_kos.tsv
    hal: resources/kofamscan/ribosome_reference/cytosolic_eukaryotic_ribosome.hal
    require_thresholds: true

  execution:
    threads: 4
    mem_mb: 8000
    threshold_scale: 1.0

  columns:
    gene_id: gene_id
    protein_id: protein_id
    cds_id: cds_id

  inputs:
    proteins: results/per_genome/{{sample}}/proteins/proteins.faa
    cds: results/per_genome/{{sample}}/sequences/cds.fna
    gene_protein_map: results/per_genome/{{sample}}/tables/gene_protein_map.tsv


# ==============================================================================
# 5. tRNAscan-SE and tRNA profile cleaning
# ==============================================================================
# tRNA gene counts are used to estimate codon adaptation/tAI-related quantities.
# Pseudogenes and ambiguous predictions should generally be removed for the main
# analysis, because they can inflate anticodon availability.
# ==============================================================================

trnascanse:
  threads: 2

  # The maximum-sensitivity mode can be much slower and should only be used when
  # explicitly justified.
  max_sensitivity: false

trnascanse_clean:
  # Recommended for main analysis.
  keep_pseudo: false

  # Remove predictions/sequences with ambiguous NNN codons.
  remove_nnn: true


# ==============================================================================
# 6. tRNA/tAI QC thresholds
# ==============================================================================
# QC mode:
#   warn - keep samples but annotate QC failures
#   fail - stop the workflow when QC thresholds are not met
#
# For broad fungal surveys, warn is practical, but failed samples must be reported.
# ==============================================================================

trna_qc:
  mode: warn

  min_total_trnas: 20
  min_unique_anticodons: 15
  min_amino_acids: 18

  # Fraction of genes with finite tAI values.
  min_finite_tai_fraction: 0.9

  # Fraction of used codons represented by usable tRNA/codon information.
  min_used_codon_coverage: 0.95


# ==============================================================================
# 7. Gene-protein-CDS mapping
# ==============================================================================
# This controls how strictly proteome records must match CDS/GFF-derived mappings.
# ==============================================================================

gene_protein_map:
  strict_proteome_match: false
  max_missing_proteome_count: 200
  max_missing_proteome_fraction: 0.05


# ==============================================================================
# 8. Core statistical analysis
# ==============================================================================
# These settings define the features, covariates and grouping variables used in
# gene-level and genome-level tests.
#
# Important biological note:
# Group-level comparisons by phylum/lifestyle are exploratory unless explicitly
# corrected for phylogenetic non-independence.
# ==============================================================================

statistics:
  # Binary gene-level features tested against tAI or summarized in tAI tails.
  binary_features:
    - signal_peptide_present
    - tm_present
    - lcr_present
    - pfam_present

  # Gene-level covariates. Protein length and GC3s are important because both can
  # confound codon-usage and gene-feature associations.
  gene_covariates:
    - log_protein_length_aa
    - GC3s

  # Genome-level metrics used for phylum/lifestyle summaries and group tests.
  # Round 4 plotting uses only mean-level metrics to avoid duplicated mean/median
  # panels and to keep genome-metric figures readable.
  genome_metrics:
    - mean_tAI
    - mean_CAI
    - mean_GC
    - mean_GC3s
    - mean_ENC
    - mean_delta_ENC

  # Metadata group variables used in genome-level comparisons.
  group_variables:
    - phylum
    - lifestyle

  fdr_method: BH

  # Per-genome feature effects help assess whether feature-tAI associations are
  # consistent across genomes rather than driven by one large genome.
  per_genome_feature_effects:
    enabled: true
    min_genes: 100
    min_class_genes: 10
    min_genomes: 5

  # Lifestyle permutations within phylum reduce, but do not eliminate, phylogenetic
  # and clade-composition confounding.
  lifestyle_within_phylum_permutations:
    enabled: true
    n_perm: 9999
    seed: 1

  # Within-genome tAI tail analysis.
  # Tails must be selected per sample, not globally across all genes.
  tai_extremes:
    enabled: true

    group_column: sample
    id_column: gene_id
    value_column: tAI

    tail_fractions:
      - 0.10
      - 0.01

    min_genes_per_sample: 100
    min_tail_size: 20

    binary_features:
      PFAM domain presence: pfam_present
      Transmembrane presence: tm_present
      Signal peptide presence: signal_peptide_present
      LCR presence: lcr_present

    continuous_features:
      Protein length: protein_length_aa
      GC3s: GC3s
      Total transmembrane length: tm_total_length
      Total LCR length: lcr_total_length


# ==============================================================================
# 9. GO enrichment
# ==============================================================================
# GO enrichment is only biologically meaningful when GO annotation coverage is
# sufficient and reasonably balanced across genomes/groups.
# ==============================================================================

go_enrichment:
  enabled: true

  # false means: do not stop the whole pipeline if GO annotations are sparse.
  # Keep false during development; consider true only for a GO-focused final run.
  require_go_terms: false

  min_genes_with_go_total: 100
  min_genes_with_go_per_sample: 10

  tail_fraction: 0.1
  max_tail_genes: 0

  min_genomes_with_term: 5
  min_informative_genomes: 3
  min_total_genes_with_term: 10

  fdr_method: BH


# ==============================================================================
# 10. Plot group switches
# ==============================================================================
# This section controls which broad figure groups are part of the default workflow.
# Specific plot families can have additional configuration in later sections.
# ==============================================================================

plots:
  enabled: true

  groups:
    tai_extremes: true
    gene_features: true
    genome_metrics: true
    codon_profiles: true
    go_enrichment: true
    correlations: true
    qc: true
    script_suggestions: true

  output_formats:
    - png
    - pdf

  max_categories_without_faceting: 8
  default_top_n_terms: 20
  default_top_n_categories: 12


# ==============================================================================
# 11. GO plot filters
# ==============================================================================
# These thresholds control visualization, not enrichment testing itself.
# ==============================================================================

go_plots:
  enabled: true
  q_threshold: 0.05
  min_abs_log2_or: 0.25
  min_informative_genomes: 5
  min_total_genes_with_term: 30
  max_terms_per_tail_namespace: 8
  max_plot_terms: 24

  namespaces:
    - biological_process
    - molecular_function
    - cellular_component


# ==============================================================================
# 12. PFAM/LCR plot settings
# ==============================================================================

pfam_lcr_plots:
  enabled: true
  top_n_pfam: 25

  # Groups with fewer genomes are collapsed into Other in PFAM/LCR grouped plots.
  min_group_n: 5

  pfam_description_table: resources/annotations/pfam_descriptions_manual.tsv


# ==============================================================================
# 13. Codon-profile plot settings
# ==============================================================================
# This block is separate from plots.groups.codon_profiles.
# plots.groups.codon_profiles only turns this plot family on/off.
# The settings below control how codon-profile plots are constructed.
# ==============================================================================

codon_profile_plots:
  usage_value: genome_RSCU
  heatmap_value: auto
  top_n_variable_codons: 30

  # The tall source is divided vertically into two A4 pages in LaTeX.
  heatmap_large_width: 30.0
  heatmap_large_height: 28.0

  # Minimum number of genomes per group for collapsed heatmap group labels.
  heatmap_min_group_n: 5


# ==============================================================================
# 14. Script-suggestion / legacy-compatible exploratory plots
# ==============================================================================
# This block controls the optional plot layer derived from older exploratory
# scripts. It is intentionally separated from the core statistical outputs.
#
# Use this layer for review, diagnostics and exploratory figures. Do not treat
# these plots as independent confirmatory analyses unless the corresponding
# statistical model is documented elsewhere.
# ==============================================================================

script_suggestion_plots:
  enabled: true

  # Select exploratory families generated by the default pipeline. Correlations
  # remain enabled because their legacy-compatible layout is reviewed separately
  # from the canonical matrices.
  families:
    features_tai: true
    codon_trna: true
    genome_gc_tai: true
    correlations: true
    go_term_features: true

  # Metric used on the y-axis for feature/tail plots.
  # Recommended: tAI. CAI is possible but changes biological interpretation,
  # because CAI depends directly on the selected ribosomal reference.
  feature_metric: tAI

  # Fraction used for all-vs-top-bottom plots.
  # Tails must be selected within each genome, not globally across all genes.
  top_fraction: 0.10

  # Canonical automatically selected GO-term subset used for chosen-GO-term
  # exploratory plots. The file is produced from results/statistics/go_enrichment.tsv
  # by select_chosen_go_terms.R. Use null only if you intentionally want to
  # disable chosen-GO-term subset plots.
  chosen_go_terms: results/statistics/chosen_GOterms.tsv

  # Correlation method for exploratory correlation plots.
  # Recommended: spearman because codon/gene features are often non-normal.
  correlation_method: spearman

  # Row caps used to keep large exploratory plots tractable.
  max_violin_rows_per_group: 50000
  max_scatter_rows: 100000

  # Gene-level numeric variables used in exploratory correlation plots.
  gene_correlation_variables:
    - tAI
    - CAI
    - ENC
    - delta_ENC
    - GC
    - GC3s
    - protein_length_aa
    - lcr_total_length
    - tm_total_length

  # Genome-level numeric variables used in exploratory correlation plots.
  genome_correlation_variables:
    - mean_tAI
    - median_tAI
    - mean_CAI
    - median_CAI
    - mean_ENC
    - median_ENC
    - mean_delta_ENC
    - median_delta_ENC
    - genome_gc
    - mean_GC
    - mean_GC3s
    - median_GC3s
    - fraction_lcr
    - fraction_tm
    - fraction_signal_peptide
    - fraction_pfam

# ==============================================================================
# 15. Plot style pointer
# ==============================================================================
# The actual visual theme lives in config/plotting.yaml. Keeping the style in a
# separate file prevents biological/methodological config from becoming cluttered.
# ==============================================================================

plot_style:
  config_file: config/plotting.yaml

  heatmap_palette:
    provider: viridis
    option: C
    begin: 0.12
    end: 0.88
    na_colour: "#D9D9D9"


# ==============================================================================
# 16. Report generation
# ==============================================================================

report_config:
  enabled: false
  template_path: workflow/scripts/report/report_template.Rmd
