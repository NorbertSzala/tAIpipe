# ---------------------
# --- Project Paths ---
# ---------------------

paths:
  # input file 
  data_cds: "tests/data/CDS"
  data_genome: "tests/data/genome"
  data_gff: "tests/data/gff"
  data_proteome: "tests/data/proteome"


  genetic_codes_trnascanse: "resources/genetic_codes/trnascanse"
  genetic_codes_tables: "resources/genetic_codes/tables"

  # Main sample sheet. It defines sample IDs, input file patterns, taxonomy lifestyle, genetic code, domain and whether a sample should be included.
  metadata_dataset: "config/samples_test.tsv"

  # Optional precomputed annotation table with at least sample and protein_id.Use null when no external annotation table is supplied.
  external_annotations: null

  # ----- Root output directories -----
  results: "test/output/results"
  logs: "test/output/logs"
  benchmarks: "test/output/benchmarks"

  # Quality-control outputs collected across samples.
  qc: "test/output/results/qc"

  per_genome: "test/output/results/per_genome"

  # ---- Output analysis tables generated by this workflow and used by statistics and plotting scripts ----
  tables: "test/output/results/tables"
  gene_features: "test/output/results/tables/gene_features.tsv"
  genome_summary: "test/output/results/tables/genome_summary.tsv"
  codon_profiles: "test/output/results/tables/codon_profiles.tsv"
  gene_go: "test/output/results/tables/gene_go.tsv"
  gene_pfam: "test/output/results/tables/gene_pfam.tsv"



  # Statistical result tables. Plotting scripts should read these files rather
  # than recomputing statistical tests.
  statistics: "test/output/results/statistics"
  gene_feature_tests: "test/output/results/statistics/gene_feature_tests.tsv"
  genome_group_tests: "test/output/results/statistics/genome_group_tests.tsv"
  go_enrichment: "test/output/results/statistics/go_enrichment.tsv"

  # ---- Final visualizations and optional reports ----
  plots: "test/output/results/plots"
  reports: "test/output/results/reports"


# ---------------------------
# --- Resource generation ---
# ---------------------------

go_dictionary:
  # When enabled, prepare_go_dictionary creates/validates the TSV dictionary.
  enabled: true
  path: "resources/go/go_terms.tsv"
  obo_path: "resources/go/go-basic.obo"
  obo_url: "https://purl.obolibrary.org/obo/go/go-basic.obo"

ribosomal_reference:
  # Initial pragmatic method: select annotated cytosolic 40S/60S structural
  # ribosomal proteins from protein FASTA headers and map protein IDs to CDS.
  enabled: true
  method: "protein_header"
  include_regex: "(^|[[:space:]])(40S|60S)[[:space:]]+ribosomal[[:space:]]+protein"
  exclude_regex: "mitochondrial|mitochondrion|biogenesis|assembly|processing|associated|partial"
  # QC bounds are warnings, not universal biological constants.
  min_reference_genes: 50
  max_reference_genes: 180


# -----------------
# --- Kofamscan ---
# -----------------
kofamscan:
  enabled: true

  database:
    ko_list: "resources/kofamscan/ko_list"
    profiles_dir: "resources/kofamscan/profiles"

  ribosome_reference:
    brite_json: "resources/kofamscan/ribosome_reference/ko03011.json"
    ko_table: "resources/kofamscan/ribosome_reference/cytosolic_eukaryotic_ribosome_kos.tsv"
    hal: "resources/kofamscan/ribosome_reference/cytosolic_eukaryotic_ribosome.hal"
    require_thresholds: true

  execution:
    threads: 4
    mem_mb: 8000
    threshold_scale: 1.0

  columns:
    gene_id: "gene_id"
    protein_id: "protein_id"
    cds_id: "cds_id"

# ---------------------------
# --- Analysis parameters ---
# ---------------------------

trnascanse:
  threads: 16
  # Maximum-sensitivity mode is slower but appropriate for final production.
  max_sensitivity: true

trnascanse_clean:
  # Pseudogenes and undetermined NNN calls should normally not contribute to the tRNA gene-copy-number profile used for tAI.
  keep_pseudo: false
  remove_nnn: true

trna_qc:
  mode: "warn" #Available mods: error: stop on WARN/FAIL; warn: record and continue; ignore: record silently.
  min_total_trnas: 20
  min_unique_anticodons: 15
  min_amino_acids: 18
  min_finite_tai_fraction: 0.90
  min_used_codon_coverage: 0.95

statistics:
  binary_features:
    - signal_peptide_present
    - tm_present
    - lcr_present
    - pfam_present

  # Covariates intended for the updated gene-level models.
  gene_covariates:
    - log_protein_length_aa
    - GC3s

  genome_metrics:
    - mean_tAI
    - median_tAI
    - mean_GC3s
    - median_delta_ENC

  group_variables:
    - phylum
    - lifestyle

  fdr_method: "BH"

go_enrichment:
  # Select tails independently within every genome.
  tail_fraction: 0.10

  # 0 means no absolute cap. Set to 100 only when you intentionally want "up to 100 most extreme genes", which is not exactly a 10% tail.
  max_tail_genes: 0

  # A GO term must be represented across enough genomes to support a stratified analysis.
  min_genomes_with_term: 5
  min_informative_genomes: 3
  min_total_genes_with_term: 10
  fdr_method: "BH"

report_config:
  # The report is currently disabled; tables and plots remain primary outputs.
  enabled: false
  template_path: "workflow/scripts/report_template.Rmd"

