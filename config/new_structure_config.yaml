input:
  samples: "config/samples.tsv"

  directories:
    genomes: "../FungaltAI/data/genome"
    cds: "../FungaltAI/data/CDS"
    proteomes: "/db/183_fungi_mai_2022/proteomes"
    gff: "../FungaltAI/data/gff"


resources:
  genetic_codes:
    trnascanse: "resources/genetic_codes/trnascanse"
    tables: "resources/genetic_codes/tables"

  go:
    enabled: true
    dictionary: "resources/go/go_terms.tsv"
    obo: "resources/go/go-basic.obo"
    obo_url: "https://purl.obolibrary.org/obo/go/go-basic.obo"

  kofam:
    ko_list: "resources/kofamscan/ko_list"
    profiles: "resources/kofamscan/profiles"

    ribosome:
      brite_json: "resources/kofamscan/ribosome_reference/ko03011.json"
      ko_table: "resources/kofamscan/ribosome_reference/cytosolic_eukaryotic_ribosome_kos.tsv"
      hal: "resources/kofamscan/ribosome_reference/cytosolic_eukaryotic_ribosome.hal"
      require_thresholds: true


output:
  root: "results"
  per_genome: "results/per_genome"
  logs: "logs"
  benchmarks: "benchmarks"

  tables:
    directory: "results/tables"
    gene_features: "results/tables/gene_features.tsv"
    genome_summary: "results/tables/genome_summary.tsv"
    codon_profiles: "results/tables/codon_profiles.tsv"
    gene_go: "results/tables/gene_go.tsv"
    gene_pfam: "results/tables/gene_pfam.tsv"

  statistics:
    directory: "results/statistics"
    gene_feature_tests: "results/statistics/gene_feature_tests.tsv"
    genome_group_tests: "results/statistics/genome_group_tests.tsv"
    go_enrichment: "results/statistics/go_enrichment.tsv"

  plots: "results/plots"
  reports: "results/reports"


tools:
  trnascanse:
    threads: 16
    max_sensitivity: true

  kofamscan:
    threads: 8
    mem_mb: 16000
    threshold_scale: 1.0


filtering:
  trnascanse:
    keep_pseudo: false
    remove_nnn: true


quality_control:
  trna:
    mode: "warn"
    min_total_trnas: 20
    min_unique_anticodons: 15
    min_amino_acids: 18
    min_finite_tai_fraction: 0.90
    min_used_codon_coverage: 0.95

  ribosome:
    min_reference_genes: 40
    max_reference_genes: 200
    min_ko_coverage: 0.60


statistics:
  binary_features:
    - signal_peptide_present
    - tm_present
    - lcr_present
    - pfam_present

  gene_covariates:
    - log_protein_length_aa
    - GC3s

  genome_metrics:
    - mean_tAI
    - median_tAI
    - mean_GC3s
    - median_delta_ENC

  group_variables:
    - phylum
    - lifestyle

  fdr_method: "BH"


go_enrichment:
  tail_fraction: 0.10
  max_tail_genes: 0
  min_genomes_with_term: 5
  min_informative_genomes: 3
  min_total_genes_with_term: 10
  fdr_method: "BH"


report:
  enabled: false
  template: "workflow/scripts/report/report_template.Rmd"