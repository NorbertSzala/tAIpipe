# Optional configuration block for the script_suggestions-compatible plot layer.
# Merge into config/config.yaml if you include workflow/rules/13_script_suggestion_plots.smk.

script_suggestion_plots:
  enabled: true

  # Metric used on the y-axis for feature plots.
  # Recommended: tAI. CAI is possible but changes biological interpretation.
  feature_metric: "tAI"

  # Tails for all-vs-top-bottom plots. Selected within each genome.
  top_fraction: 0.10

  # XXXXX by default because the old chosen_GOterms.tsv did not document how GO
  # terms were selected. Replace with an explicit file containing GO IDs if you
  # want GO-term subset plots.
  chosen_go_terms: "XXXXX"

  correlation_method: "spearman"

  gene_correlation_variables:
    - tAI
    - CAI
    - ENC
    - GC
    - GC3s
    - protein_length_aa
    - lcr_total_length
    - tm_total_length

  genome_correlation_variables:
    - mean_tAI
    - median_tAI
    - mean_CAI
    - median_CAI
    - mean_ENC
    - median_ENC
    - genome_gc
    - mean_GC3s
    - median_GC3s
    - fraction_lcr
    - fraction_tm
    - fraction_signal_peptide
    - fraction_pfam
