$schema: "http://json-schema.org/draft-07/schema#"

title: "tAIpipe configuration"
description: >-
  Validation schema for input paths, workflow outputs, tool parameters,
  quality-control thresholds and statistical settings.

type: object
additionalProperties: true

required:
  - paths
  - go_dictionary
  - ribosomal_reference
  - kofamscan
  - trnascanse
  - trnascanse_clean
  - trna_qc
  - statistics
  - go_enrichment
  - report_config
  - gene_protein_map

properties:
  paths:
    type: object
    additionalProperties: false
    required:
      - data_cds
      - data_genome
      - data_gff
      - data_proteome
      - genetic_codes_trnascanse
      - genetic_codes_tables
      - metadata_dataset
      - external_annotations
      - results
      - logs
      - benchmarks
      - per_genome
      - tables
      - gene_features
      - genome_summary
      - codon_profiles
      - gene_go
      - gene_pfam
      - qc
      - statistics
      - gene_feature_tests
      - genome_group_tests
      - go_enrichment
      - plots
      - reports
    properties:
      data_cds:
        type: string
        minLength: 1
        description: "Directory containing per-sample CDS FASTA files."
      data_genome:
        type: string
        minLength: 1
        description: "Directory containing genomic FASTA files used by tRNAscan-SE."
      data_gff:
        type: string
        minLength: 1
        description: "Directory containing genome annotation GFF/GFF3 files."
      data_proteome:
        type: string
        minLength: 1
        description: "Directory containing protein FASTA files."
      genetic_codes_trnascanse:
        type: string
        minLength: 1
        description: "Custom tRNAscan-SE genetic-code definition files."
      genetic_codes_tables:
        type: string
        minLength: 1
        description: "Small codon/genetic-code lookup tables used by workflow scripts."
      metadata_dataset:
        type: string
        minLength: 1
        description: "Main TSV sample sheet validated by metadata_dataset.schema.yaml."
      external_annotations:
        type:
          - string
          - "null"
        description: "Optional external protein/GO annotation TSV."
      results:
        type: string
        minLength: 1
      logs:
        type: string
        minLength: 1
      benchmarks:
        type: string
        minLength: 1
      per_genome:
        type: string
        minLength: 1
      tables:
        type: string
        minLength: 1
      gene_features:
        type: string
        minLength: 1
      genome_summary:
        type: string
        minLength: 1
      codon_profiles:
        type: string
        minLength: 1
      gene_go:
        type: string
        minLength: 1
      gene_pfam:
        type: string
        minLength: 1
      qc:
        type: string
        minLength: 1
      statistics:
        type: string
        minLength: 1
      gene_feature_tests:
        type: string
        minLength: 1
      genome_group_tests:
        type: string
        minLength: 1
      go_enrichment:
        type: string
        minLength: 1
      plots:
        type: string
        minLength: 1
      reports:
        type: string
        minLength: 1

  go_dictionary:
    type: object
    additionalProperties: false
    required:
      - enabled
      - path
      - obo_path
      - obo_url
    properties:
      enabled:
        type: boolean
      path:
        type: string
        minLength: 1
      obo_path:
        type: string
        minLength: 1
      obo_url:
        type: string
        format: uri

  ribosomal_reference:
    type: object
    additionalProperties: false
    required:
      - enabled
      - method
      - include_regex
      - exclude_regex
      - min_reference_genes
      - max_reference_genes
    properties:
      enabled:
        type: boolean
      method:
        type: string
        enum:
          - protein_header
          - curated_orthologs
      include_regex:
        type: string
        minLength: 1
      exclude_regex:
        type: string
      min_reference_genes:
        type: integer
        minimum: 1
      max_reference_genes:
        type: integer
        minimum: 1

  kofamscan:
    type: object
    additionalProperties: false
    required:
      - enabled
      - database
      - ribosome_reference
      - execution
      - columns
    properties:
      enabled:
        type: boolean
      database:
        type: object
        additionalProperties: false
        required:
          - ko_list
          - profiles_dir
        properties:
          ko_list:
            type: string
            minLength: 1
          profiles_dir:
            type: string
            minLength: 1
      ribosome_reference:
        type: object
        additionalProperties: false
        required:
          - brite_json
          - ko_table
          - hal
          - require_thresholds
        properties:
          brite_json:
            type: string
            minLength: 1
          ko_table:
            type: string
            minLength: 1
          hal:
            type: string
            minLength: 1
          require_thresholds:
            type: boolean
      execution:
        type: object
        additionalProperties: false
        required:
          - threads
          - mem_mb
          - threshold_scale
        properties:
          threads:
            type: integer
            minimum: 1
          mem_mb:
            type: integer
            minimum: 256
          threshold_scale:
            type: number
            exclusiveMinimum: 0
      columns:
        type: object
        additionalProperties: false
        required:
          - gene_id
          - protein_id
          - cds_id
        properties:
          gene_id:
            type: string
            minLength: 1
          protein_id:
            type: string
            minLength: 1
          cds_id:
            type: string
            minLength: 1
      inputs:
        type: object
        additionalProperties: true

  trnascanse:
    type: object
    additionalProperties: false
    required:
      - threads
      - max_sensitivity
    properties:
      threads:
        type: integer
        minimum: 1
      max_sensitivity:
        type: boolean

  trnascanse_clean:
    type: object
    additionalProperties: false
    required:
      - keep_pseudo
      - remove_nnn
    properties:
      keep_pseudo:
        type: boolean
      remove_nnn:
        type: boolean

  trna_qc:
    type: object
    additionalProperties: false
    required:
      - mode
      - min_total_trnas
      - min_unique_anticodons
      - min_amino_acids
      - min_finite_tai_fraction
      - min_used_codon_coverage
    properties:
      mode:
        type: string
        enum:
          - error
          - warn
          - ignore
      min_total_trnas:
        type: integer
        minimum: 1
      min_unique_anticodons:
        type: integer
        minimum: 1
        maximum: 64
      min_amino_acids:
        type: integer
        minimum: 1
        maximum: 20
      min_finite_tai_fraction:
        type: number
        minimum: 0
        maximum: 1
      min_used_codon_coverage:
        type: number
        minimum: 0
        maximum: 1

  statistics:
    type: object
    additionalProperties: false
    required:
      - binary_features
      - gene_covariates
      - genome_metrics
      - group_variables
      - fdr_method
    properties:
      binary_features:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
      gene_covariates:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      genome_metrics:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
      group_variables:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
      fdr_method:
        type: string
        enum:
          - BH
          - BY
          - holm
          - hochberg
          - hommel
          - bonferroni
          - none
      tai_extremes:
        type: object
        additionalProperties: false
        required:
          - enabled
          - group_column
          - id_column
          - value_column
          - tail_fractions
          - binary_features
          - continuous_features
        properties:
          enabled:
            type: boolean

          group_column:
            type: string
            minLength: 1

          id_column:
            type: string
            minLength: 1

          value_column:
            type: string
            minLength: 1

          tail_fractions:
            type: array
            minItems: 1
            uniqueItems: true
            items:
              type: number
              exclusiveMinimum: 0
              exclusiveMaximum: 1

          binary_features:
            type: object
            minProperties: 1
            additionalProperties:
              type: string
              minLength: 1

          continuous_features:
            type: object
            minProperties: 1
            additionalProperties:
              type: string
              minLength: 1

  go_enrichment:
    type: object
    additionalProperties: true
    required:
      - tail_fraction
      - max_tail_genes
      - min_genomes_with_term
      - min_informative_genomes
      - min_total_genes_with_term
      - fdr_method
    properties:
      tail_fraction:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 0.5
      max_tail_genes:
        type: integer
        minimum: 0
        description: "Zero disables the absolute tail-size cap."
      min_genomes_with_term:
        type: integer
        minimum: 1
      min_informative_genomes:
        type: integer
        minimum: 2
      min_total_genes_with_term:
        type: integer
        minimum: 1
      fdr_method:
        type: string
        enum:
          - BH
          - BY
          - holm
          - hochberg
          - hommel
          - bonferroni
          - none
      enabled:
        type: boolean
        description: "Whether GO enrichment should be included in the workflow."

      require_go_terms:
        type: boolean
        description: "Whether the workflow should fail if gene_features.tsv has no valid GO annotations."

  report_config:
    type: object
    additionalProperties: false
    required:
      - enabled
      - template_path
    properties:
      enabled:
        type: boolean
      template_path:
        type: string
        minLength: 1
  
  gene_protein_map:
    type: object
    additionalProperties: false
    required:
      - strict_proteome_match
      - max_missing_proteome_count
      - max_missing_proteome_fraction
    properties:
      strict_proteome_match:
        type: boolean
      max_missing_proteome_count:
        type: number
      max_missing_proteome_fraction:
        type: number
        description: "What fraction of protein in proteome can be mismatched to given CDS fasta file."
    
  plots:
    type: object
    additionalProperties: false
    required:
      - enabled
      - groups
      - output_formats
      - max_categories_without_faceting
      - default_top_n_categories
      - default_top_n_terms
    properties:
      enabled:
        type: boolean
        default: true

      groups:
        type: object
        additionalProperties: false
        required:
          - tai_extremes
          - gene_features
          - genome_metrics
          - codon_profiles
          - go_enrichment
          - correlations
          - qc
        properties:
          tai_extremes:
            type: boolean
          gene_features:
            type: boolean
          genome_metrics:
            type: boolean
          codon_profiles:
            type: boolean
          go_enrichment:
            type: boolean
          correlations:
            type: boolean
          qc:
            type: boolean

      output_formats:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          enum:
            - png
            - pdf
            - svg

      max_categories_without_faceting:
        type: integer
        minimum: 2
        description: "When the number of categories exceeds this value, plotting scripts should facet, group rare categories, or use alternative encodings."

      default_top_n_categories:
        type: integer
        minimum: 1

      default_top_n_terms:
        type: integer
        minimum: 1