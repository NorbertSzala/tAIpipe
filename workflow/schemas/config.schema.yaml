$schema: "http://json-schema.org/draft-07/schema#"

title: "tAIpipe configuration"
description: >-
  Validation schema for input paths, workflow outputs, tool parameters,
  quality-control thresholds and statistical settings.

type: object
additionalProperties: true

required:
  - paths
  - go_dictionary
  - ribosomal_reference
  - trnascanse
  - trnascanse_clean
  - trna_qc
  - statistics
  - go_enrichment
  - report_config

properties:
  paths:
    type: object
    additionalProperties: false
    required:
      - data_cds
      - data_genome
      - data_gff
      - data_proteome
      - genetic_codes_trnascanse
      - genetic_codes_tables
      - metadata_dataset
      - external_annotations
      - results
      - logs
      - benchmarks
      - per_genome
      - tables
      - gene_features
      - genome_summary
      - codon_profiles
      - gene_go
      - gene_pfam
      - qc
      - statistics
      - gene_feature_tests
      - genome_group_tests
      - go_enrichment
      - plots
      - reports
    properties:
      data_cds:
        type: string
        minLength: 1
        description: "Directory containing per-sample CDS FASTA files."
      data_genome:
        type: string
        minLength: 1
        description: "Directory containing genomic FASTA files used by tRNAscan-SE."
      data_gff:
        type: string
        minLength: 1
        description: "Directory containing genome annotation GFF/GFF3 files."
      data_proteome:
        type: string
        minLength: 1
        description: "Directory containing protein FASTA files."
      genetic_codes_trnascanse:
        type: string
        minLength: 1
        description: "Custom tRNAscan-SE genetic-code definition files."
      genetic_codes_tables:
        type: string
        minLength: 1
        description: "Small codon/genetic-code lookup tables used by workflow scripts."
      metadata_dataset:
        type: string
        minLength: 1
        description: "Main TSV sample sheet validated by metadata_dataset.schema.yaml."
      external_annotations:
        type:
          - string
          - "null"
        description: "Optional external protein/GO annotation TSV."
      results:
        type: string
        minLength: 1
      logs:
        type: string
        minLength: 1
      benchmarks:
        type: string
        minLength: 1
      per_genome:
        type: string
        minLength: 1
      tables:
        type: string
        minLength: 1
      gene_features:
        type: string
        minLength: 1
      genome_summary:
        type: string
        minLength: 1
      codon_profiles:
        type: string
        minLength: 1
      gene_go:
        type: string
        minLength: 1
      gene_pfam:
        type: string
        minLength: 1
      qc:
        type: string
        minLength: 1
      statistics:
        type: string
        minLength: 1
      gene_feature_tests:
        type: string
        minLength: 1
      genome_group_tests:
        type: string
        minLength: 1
      go_enrichment:
        type: string
        minLength: 1
      plots:
        type: string
        minLength: 1
      reports:
        type: string
        minLength: 1

  go_dictionary:
    type: object
    additionalProperties: false
    required:
      - enabled
      - path
      - obo_path
      - obo_url
    properties:
      enabled:
        type: boolean
      path:
        type: string
        minLength: 1
      obo_path:
        type: string
        minLength: 1
      obo_url:
        type: string
        format: uri

  ribosomal_reference:
    type: object
    additionalProperties: false
    required:
      - enabled
      - method
      - include_regex
      - exclude_regex
      - min_reference_genes
      - max_reference_genes
    properties:
      enabled:
        type: boolean
      method:
        type: string
        enum:
          - protein_header
          - curated_orthologs
      include_regex:
        type: string
        minLength: 1
      exclude_regex:
        type: string
      min_reference_genes:
        type: integer
        minimum: 1
      max_reference_genes:
        type: integer
        minimum: 1

  trnascanse:
    type: object
    additionalProperties: false
    required:
      - threads
      - max_sensitivity
    properties:
      threads:
        type: integer
        minimum: 1
      max_sensitivity:
        type: boolean

  trnascanse_clean:
    type: object
    additionalProperties: false
    required:
      - keep_pseudo
      - remove_nnn
    properties:
      keep_pseudo:
        type: boolean
      remove_nnn:
        type: boolean

  trna_qc:
    type: object
    additionalProperties: false
    required:
      - mode
      - min_total_trnas
      - min_unique_anticodons
      - min_amino_acids
      - min_finite_tai_fraction
      - min_used_codon_coverage
    properties:
      mode:
        type: string
        enum:
          - error
          - warn
          - ignore
      min_total_trnas:
        type: integer
        minimum: 1
      min_unique_anticodons:
        type: integer
        minimum: 1
        maximum: 64
      min_amino_acids:
        type: integer
        minimum: 1
        maximum: 20
      min_finite_tai_fraction:
        type: number
        minimum: 0
        maximum: 1
      min_used_codon_coverage:
        type: number
        minimum: 0
        maximum: 1

  statistics:
    type: object
    additionalProperties: false
    required:
      - binary_features
      - gene_covariates
      - genome_metrics
      - group_variables
      - fdr_method
    properties:
      binary_features:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
      gene_covariates:
        type: array
        uniqueItems: true
        items:
          type: string
          minLength: 1
      genome_metrics:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
      group_variables:
        type: array
        minItems: 1
        uniqueItems: true
        items:
          type: string
          minLength: 1
      fdr_method:
        type: string
        enum:
          - BH
          - BY
          - holm
          - hochberg
          - hommel
          - bonferroni
          - none

  go_enrichment:
    type: object
    additionalProperties: false
    required:
      - tail_fraction
      - max_tail_genes
      - min_genomes_with_term
      - min_informative_genomes
      - min_total_genes_with_term
      - fdr_method
    properties:
      tail_fraction:
        type: number
        exclusiveMinimum: 0
        exclusiveMaximum: 0.5
      max_tail_genes:
        type: integer
        minimum: 0
        description: "Zero disables the absolute tail-size cap."
      min_genomes_with_term:
        type: integer
        minimum: 1
      min_informative_genomes:
        type: integer
        minimum: 2
      min_total_genes_with_term:
        type: integer
        minimum: 1
      fdr_method:
        type: string
        enum:
          - BH
          - BY
          - holm
          - hochberg
          - hommel
          - bonferroni
          - none

  report_config:
    type: object
    additionalProperties: false
    required:
      - enabled
      - template_path
    properties:
      enabled:
        type: boolean
      template_path:
        type: string
        minLength: 1
