name: r-env

channels:
  - conda-forge
  - bioconda
  - defaults

dependencies:
  - r-base=4.3
  
  # --- Core Data Manipulation & Bioinformatics ---
  - bioconductor-biostrings
  - bioconductor-iranges
  - r-dplyr
  - r-tidyr
  - r-readr
  - r-tibble
  - r-stringr
  - r-data.table
  - r-rlang
  - r-optparse
  - r-remotes

  # --- Data Visualization & Interactive Features ---
  - r-ggplot2
  - r-plotly
  - r-dt

  # --- Automated Reporting Engines ---
  - r-rmarkdown
  - r-knitr
  - pandoc





